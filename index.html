<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Privacy: this policy blocks ALL network requests. Nothing leaves this page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<title>Gym Team Maker</title>
<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--ink:#14171c;--muted:#5a6270;--line:#d9dee6;
  --accent:#1f56d6;--accent-ink:#ffffff;--soft:#e8effd;--sel:#ffe27a;--sel-ink:#14171c;
  --warn:#9a4a00;--warn-bg:#fff4e0;--bad:#b42318;--ok:#17723a;--ok-bg:#e6f6ec;
  --absent:#e9ecf1;--absent-ink:#8a919c;--boy:#1f56d6;--girl:#b0287a;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418;--card:#1b1f25;--ink:#eef1f5;--muted:#a3abb7;--line:#30363f;
    --accent:#5b8cff;--accent-ink:#0b1020;--soft:#1f2a44;--sel:#ffd84d;--sel-ink:#111;
    --warn:#ffb65c;--warn-bg:#3a2a12;--bad:#ff7a6e;--ok:#5fd68a;--ok-bg:#15301f;
    --absent:#22272e;--absent-ink:#6c7380;--boy:#7aa2ff;--girl:#ff7ac4;--shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;margin-right:auto}
nav{display:flex;gap:4px}
nav button{border:0;background:none;padding:10px 14px;border-radius:10px;min-height:44px;font-weight:600;color:var(--muted)}
nav button.on{background:var(--soft);color:var(--accent)}
main{max-width:1400px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:19px;margin:0}
.card h3{font-size:17px;margin:14px 0 8px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hint{color:var(--muted);font-size:15px;margin:4px 0 10px}
.muted{color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.lbl{min-width:96px;font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:52px;min-height:48px;padding:6px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-weight:700}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button small{font-weight:500;opacity:.75}
.seg.sm button{min-width:40px;min-height:40px;padding:4px 10px}
select,input[type=text],textarea{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:48px}
select{min-width:220px;max-width:100%}
textarea{width:100%;min-height:130px;font-family:inherit}
.btn{min-height:48px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn-s{min-height:40px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.btn-big{display:block;width:100%;min-height:64px;font-size:21px;font-weight:800;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);margin:4px 0 18px;box-shadow:var(--shadow)}
.btn-big:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:4px;font-size:14px}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.att{min-height:52px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);text-align:left;font-weight:600;line-height:1.2}
.att.absent{background:var(--absent);color:var(--absent-ink);text-decoration:line-through;border-style:dashed}
.att .tagx{display:block;font-size:12px;font-weight:600;text-decoration:none;color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.toggles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.tog{min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.restitle{font-size:22px;margin:4px 0 6px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.team{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.team.drop-target{border-color:var(--accent);outline:3px solid var(--soft)}
.thead{border-bottom:1px solid var(--line);padding:2px 4px 8px;margin-bottom:6px}
.thead h3{margin:0;font-size:24px;font-weight:800}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:15px;font-weight:600}
.tmeta .str{color:var(--ink)}
.movehere{margin-top:6px;width:100%;min-height:44px;border-radius:10px;border:2px dashed var(--accent);background:var(--soft);color:var(--accent);font-weight:800}
.plist{list-style:none;margin:0;padding:0;flex:1}
.p{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 8px;margin:3px 0;border-radius:10px;border:1px solid transparent;font-size:19px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.p:hover{background:var(--soft)}
.p.sel{background:var(--sel);color:var(--sel-ink);border-color:#c9a400}
.p.dragging{opacity:.35}
.p.drop-target{outline:3px solid var(--accent)}
.p.ghost{position:fixed;z-index:100;pointer-events:none;background:var(--card);border:1.5px solid var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
.pn{flex:1;min-width:0;overflow-wrap:anywhere}
.badges{display:flex;gap:4px;align-items:center;flex-shrink:0}
.sv{min-width:26px;text-align:center;font-size:14px;font-weight:800;background:var(--soft);color:var(--accent);border-radius:6px;padding:2px 5px}
.g{font-size:12px;font-weight:800;border-radius:6px;padding:2px 5px;border:1.5px solid}
.g1{color:var(--boy);border-color:var(--boy)}.g2{color:var(--girl);border-color:var(--girl)}
.lock{font-size:15px}
.tfoot{display:flex;justify-content:flex-end;padding-top:6px}
.report{margin-top:14px}
.grphead{font-size:22px;margin:18px 0 8px}
.grphead:first-of-type{margin-top:6px}
.lvcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lvcol h3{margin:0 0 8px}
.lvcol .attgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.att.either{border-style:dashed}
.att.moved{border-color:var(--accent);border-width:2.5px}
.okline{background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:10px;padding:10px 12px;display:inline-block}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-top:8px}
.warnbox ul{margin:4px 0 0;padding-left:20px}
table.sched{border-collapse:collapse;width:100%;max-width:720px;font-size:17px}
table.sched th,table.sched td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.sched th{background:var(--soft)}
.srow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sname{flex:1 1 260px;min-width:0}
.small{font-size:14px;color:var(--muted)}
.note{font-size:14px;color:var(--warn)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.sctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:20px}
.stepper .v{min-width:34px;text-align:center;font-weight:800;font-size:18px}
.stepper .v.ovr{color:var(--accent)}
.stepper .v.guess{color:var(--muted);font-style:italic}
.icon{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:800}
.icon.danger{color:var(--bad)}
.pairs{list-style:none;padding:0;margin:6px 0}
.pairs li{display:flex;align-items:center;gap:8px;padding:4px 0}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline select{min-width:160px;flex:1}
#actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--accent);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.12);display:none}
#actionbar.show{display:block}
#actionbar .abw{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#actionbar .who{font-weight:800;font-size:18px;margin-right:auto}
#actionbar .who small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14171c;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
body.has-sel #toast{bottom:110px}
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.dlg h2{margin:0 0 8px;font-size:20px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 12px;max-height:40vh;overflow:auto}
.empty{text-align:center;padding:30px 10px}
.empty p{color:var(--muted)}
.print-only{display:none}
.exitpresent{display:none}
.report-list{margin:4px 0;padding-left:20px}
.kbd{font-family:ui-monospace,monospace;font-size:14px;background:var(--soft);padding:1px 5px;border-radius:5px}
/* Projector mode */
body.present header, body.present .setup, body.present #attCard, body.present #lvCard, body.present .btn-big, body.present .toolbar, body.present .tfoot, body.present #tab-students, body.present #tab-data, body.present .toggles{display:none!important}
body.present main{max-width:none;padding:16px 24px 40px}
body.present .restitle{font-size:34px;text-align:center}
body.present .grphead{font-size:30px}
body.present .thead h3{font-size:34px}
body.present .tmeta{font-size:20px}
body.present .p{font-size:28px;min-height:52px}
body.present .exitpresent{display:block;position:fixed;top:10px;right:10px;z-index:50;opacity:.5}
body.present .exitpresent:hover{opacity:1}
@media (max-width:520px){
  body{font-size:16px}
  .lbl{min-width:100%}
  .seg button{min-width:48px}
  .teams{grid-template-columns:1fr}
}
@media print{
  @page{margin:10mm}
  :root{--ink:#000;--muted:#333;--line:#999;--card:#fff;--bg:#fff;--soft:#eee;--accent:#000}
  body{background:#fff;color:#000;font-size:11pt}
  header,.no-print,.setup,#attCard,#lvCard,.btn-big,.toolbar,.toggles,#actionbar,#toast,#tab-students,#tab-data,.exitpresent,dialog{display:none!important}
  main{padding:0;max-width:none}
  .print-only{display:block}
  .print-inline{display:inline!important}
  .tfoot,.hint{display:none!important}
  .restitle{font-size:16pt;margin:0 0 6px}
  .grphead{font-size:12pt;margin:8px 0 3px}
  .teams{grid-template-columns:repeat(var(--pcols,3),1fr)!important;gap:6px}
  .team{break-inside:avoid;box-shadow:none;border:1px solid #888;padding:6px}
  .thead{padding:0 2px 3px;margin-bottom:2px}
  .thead h3{font-size:13pt}
  .tmeta{font-size:9pt;color:#333}
  .p{font-size:11pt;min-height:0;padding:0 4px;line-height:1.3;margin:0;background:none!important;border:0!important;color:#000!important}
  .sv,.g{font-size:8pt;padding:0 3px;border:1px solid #666;color:#000;background:none}
  .lock{display:none}
  .report{margin-top:8px;font-size:9.5pt;break-inside:avoid}
  .okline,.warnbox{background:none;color:#000;padding:2px 0}
  table.sched{font-size:10.5pt;max-width:none}
  table.sched th,table.sched td{padding:3px 6px}
  .sched-wrap{break-inside:avoid;margin-top:8px}
}
</style>

<body>
<header>
  <div class="hwrap">
    <div class="brand">🏀 Gym Teams</div>
    <nav id="nav">
      <button data-act="tab" data-v="teams">Teams</button>
      <button data-act="tab" data-v="students">Students &amp; rules</button>
      <button data-act="tab" data-v="data">Data</button>
    </nav>
  </div>
</header>
<main>
  <section id="tab-teams"></section>
  <section id="tab-students"></section>
  <section id="tab-data"></section>
</main>
<button class="btn exitpresent" data-act="present">✕ Exit projector view</button>
<div id="actionbar" class="no-print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
/* ==========================================================================
   Gym Team Maker — single offline file. No network access (see CSP above).
   All data lives in this browser's localStorage under LS_KEY.
   ========================================================================== */
const LS_KEY = 'gymTeams.v1';
const OVERALL = 'Overall (average of all sports)';
const DEFAULT_SPORTS = ['Basketball','Volleyball','Soccer','Floor Hockey','Badminton','Dodgeball','Ultimate Frisbee','Team Handball','Softball','Track & Field','Flag Football','Kickball','Pickleball','Lacrosse','Tchoukball','Capture the Flag'];
const SPORT_ALIASES = {
  'hockey':'Floor Hockey','floorball':'Floor Hockey','floor hockey':'Floor Hockey',
  'frisbee':'Ultimate Frisbee','ultimate':'Ultimate Frisbee',
  'handball':'Team Handball','team handball':'Team Handball',
  'baseball':'Softball','softball baseball':'Softball','softball':'Softball',
  'track':'Track & Field','track and field':'Track & Field','running':'Track & Field','track field':'Track & Field',
  'football':'Flag Football','flag football':'Flag Football',
  'ctf':'Capture the Flag','capture the flag':'Capture the Flag',
  'table tennis':'Pickleball'
};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ----------------------------- Storage ---------------------------------- */
function freshDB(){
  return {
    v:1, nextId:1, classes:['8A','8B'], sports:DEFAULT_SPORTS.slice(), students:[],
    rules:{together:[], apart:[], strength:{}},
    absent:{}, teams:{}, lastImport:null, levelMoves:{},
    ui:{cls:'8A', sport:'Basketball', k:4, split:false, kC:2, kK:2, genderEq:true, showStrength:true, showGender:true, showNotes:true, showSchedule:true, tab:'teams'}
  };
}
let DB, SM = new Map(), sel = null, drag = null, suppressClick = false;
function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e) { d = null; }
  const f = freshDB();
  DB = Object.assign(f, d || {});
  DB.ui = Object.assign(freshDB().ui, (d && d.ui) || {});
  DB.rules = Object.assign({together:[], apart:[], strength:{}}, (d && d.rules) || {});
  reindex();
}
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast('Could not save. Browser storage may be blocked or full.'); }
}
function reindex(){ SM = new Map(DB.students.map(s => [s.id, s])); }

/* --------------------------- Name matching ------------------------------ */
function norm(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .replace(/\(.*?\)/g,' ').replace(/['’`.-]/g,'').replace(/[^a-z0-9,\s]/g,' ').replace(/\s+/g,' ').trim();
}
function variants(s){
  const n = norm(s); const out = new Set();
  out.add(n.replace(/,/g,' ').replace(/\s+/g,' ').trim());
  if (n.includes(',')) { const i = n.indexOf(','); out.add((n.slice(i+1) + ' ' + n.slice(0,i)).replace(/,/g,' ').replace(/\s+/g,' ').trim()); }
  return [...out].filter(Boolean);
}
const sortKey = s => norm(s).replace(/,/g,' ').split(' ').filter(Boolean).sort().join(' ');
function lev(a, b){
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({length:b.length+1}, (_, j) => j), cur = new Array(b.length+1);
  for (let i = 1; i <= a.length; i++){
    cur[0] = i;
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    [prev, cur] = [cur, prev];
  }
  return prev[b.length];
}
const sim = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
/** Find the student in `cands` that best matches `raw`. canFuzzy(s) limits fuzzy matches. */
function matchName(raw, cands, canFuzzy = () => true){
  const rv = variants(raw); if (!rv.length) return null;
  const rs = sortKey(raw);
  for (const c of cands){
    const cv = variants(c.name);
    if (cv.some(x => rv.includes(x)) || sortKey(c.name) === rs) return {s:c, exact:true};
  }
  const fz = cands.filter(canFuzzy);
  let best = null, bestS = 0, second = 0;
  for (const c of fz){
    let sc = sim(rs, sortKey(c.name));
    for (const a of rv) for (const b of variants(c.name)) sc = Math.max(sc, sim(a, b));
    if (sc > bestS){ second = bestS; bestS = sc; best = c; } else if (sc > second) second = sc;
  }
  if (best && bestS >= 0.8 && (bestS - second >= 0.04 || bestS >= 0.93)) return {s:best, exact:false, score:bestS};
  // first name only, or "First L"
  const toks = rv[0].split(' ');
  if (toks.length === 1 || (toks.length === 2 && toks[1].length === 1)){
    const hits = fz.filter(c => { const t = variants(c.name)[0].split(' '); return t[0] === toks[0] && (toks.length === 1 || (t[t.length-1] || '').startsWith(toks[1])); });
    if (hits.length === 1) return {s:hits[0], exact:false, score:0.7};
  }
  return null;
}

/* ------------------------------ CSV ------------------------------------- */
function parseCSV(text){
  text = String(text).replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const delim = (firstLine.split('\t').length > firstLine.split(',').length) ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"' && f === '') q = true;
    else if (c === delim){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function canonSport(label, strict){
  const n = norm(label).replace(/&/g,'and').replace(/,/g,' ').replace(/\s+/g,' ').trim();
  if (!n) return null;
  const known = [...new Set(DB.sports.concat(DEFAULT_SPORTS))];
  for (const sp of known) if (norm(sp).replace(/&/g,'and') === n || norm(sp) === n) return sp;
  if (SPORT_ALIASES[n]) return SPORT_ALIASES[n];
  for (const [a, sp] of Object.entries(SPORT_ALIASES)) if (n.split(' ').includes(a) && a.length > 4) return sp;
  if (strict) return null;
  for (const sp of known) if (sim(norm(sp), n) >= 0.8) return sp;
  return label.trim().replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}
function mapHeaders(hdr){
  const H = {ts:-1, cls:-1, name:[], first:-1, last:-1, gender:-1, notes:[], friends:[], avoid:[], sports:[], levels:[], levelAll:-1};
  const isAvoid = h => /\bnot\b|avoid|apart|don'?t|do not|rather not be/.test(h) && /team|with|play|be/.test(h);

/* ----------------------------- Optimizer -------------------------------- */
/* Costs are weighted to follow the priority order:
   sizes (hard) > teacher lock-together / keep-apart (5000) > min 2 boys & 2 girls (1000)
   > even boy/girl spread (300) > strength spread (12 × range²) > friend missed (20)
   > student "not with" (50) > top-player spread (8). Small strength give is allowed for friends. */

  const tog = DB.rules.together.map(([x, y]) => [ix.get(x), ix.get(y)]).filter(([i, j]) => i !== undefined && j !== undefined);

    }
  }
  DB.rules.apart.forEach(([x, y]) => { if (here.has(x) && here.has(y) && teamOf.get(x) === teamOf.get(y)) warnings.push(`Keep-apart rule broken: ${nameOf(x)} & ${nameOf(y)} (Team ${teamOf.get(x)+1})`); });
  DB.rules.together.forEach(([x, y]) => { if (here.has(x) && here.has(y) && teamOf.get(x) !== teamOf.get(y)) warnings.push(`Together rule broken: ${nameOf(x)} (Team ${teamOf.get(x)+1}) & ${nameOf(y)} (Team ${teamOf.get(y)+1})`); });
  const groupStats = [];
  [...new Set(groups)].forEach(g => {
    const idx = groups.map((x, i) => x === g ? i : -1).filter(i => i >= 0);
    const lab = g === 'a' ? '' : LV_NAME[g] + ': ';
    const B = idx.reduce((a, i) => a + info[i].boys, 0), G = idx.reduce((a, i) => a + info[i].girls, 0);
    if (eq){
      const minB = Math.min(2, Math.floor(B / idx.length)), minG = Math.min(2, Math.floor(G / idx.length));
      idx.forEach(i => {
        if (info[i].boys < minB) warnings.push(`${lab}Team ${i+1} has only ${info[i].boys} boy${info[i].boys === 1 ? '' : 's'}`);
        if (info[i].girls < minG) warnings.push(`${lab}Team ${i+1} has only ${info[i].girls} girl${info[i].girls === 1 ? '' : 's'}`);
      });
    }
    const sizes = idx.map(i => info[i].size);
    if (Math.max(...sizes) - Math.min(...sizes) > 1) warnings.push(`${lab}team sizes are uneven (${sizes.join(', ')}). Tap Shuffle to rebalance; locked students stay put.`);
    const sums = idx.map(i => info[i].sum);
    groupStats.push({g, spread:Math.max(...sums) - Math.min(...sums), minSum:Math.min(...sums), maxSum:Math.max(...sums)});
  });
  return {info, elig, got, missed, noneHere, noReq, otherLevel, warnings, groupStats,
    spread:Math.max(...groupStats.map(x => x.spread)), minSum:Math.min(...groupStats.map(x => x.minSum)), maxSum:Math.max(...groupStats.map(x => x.maxSum))};
}
/** Round-robin blocks: one for the whole class, or one per level group (groups of 3-6 teams). */
function scheduleBlocks(st){
  const parts = st.groups ? ['c', 'k'].map(g => ({g, off:st.groups.indexOf(g), k:st.groups.filter(x => x === g).length})) : [{g:null, off:0, k:st.teams.length}];
  return parts.filter(p => p.k >= 3 && p.k <= 6).map(p => ({title:p.g ? LV_NAME[p.g] + ' round-robin' : 'Round-robin', off:p.off, k:p.k, rr:roundRobin(p.k)}));
}
function roundRobin(k){
  const list = [...Array(k).keys()].map(i => i + 1); if (k % 2) list.push(0);
  const m = list.length, rounds = []; let arr = list.slice();
  for (let r = 0; r < m - 1; r++){
    const games = [], rest = [];
    for (let i = 0; i < m / 2; i++){ const a = arr[i], b = arr[m-1-i]; if (a && b) games.push([a, b]); else rest.push(a || b); }
    rounds.push({games, rest});
    arr = [arr[0], arr[m-1], ...arr.slice(1, m-1)];
  }
  return rounds;
}

/* ----------------------------- Actions ---------------------------------- */
function generate(){
  const cls = DB.ui.cls, sport = DB.ui.sport, split = !!DB.ui.split;
  const abs = absentSet();
  const ids = classStudents().filter(s => !abs.has(s.id)).map(s => s.id);
  const kC = DB.ui.kC, kK = DB.ui.kK, k = split ? kC + kK : DB.ui.k;
  if (ids.length < k){ toast(`Need at least ${k} players for ${k} teams.`); return; }
  let groups = null, parts;
  if (split){
    const ag = assignGroups(ids, kC, kK, sport);
    if (!ag.ok){ toast(`Not enough players: Competitive has ${ag.c.length} for ${kC} teams, Casual has ${ag.k.length} for ${kK}. Move some students or change the team counts.`); return; }
    groups = [...Array(kC).fill('c'), ...Array(kK).fill('k')];
    parts = [{ids:ag.c, k:kC, off:0}, {ids:ag.k, k:kK, off:kC}];
  } else parts = [{ids, k, off:0}];
  const prev = teamsState();
  const same = prev && JSON.stringify(prev.groups || null) === JSON.stringify(groups);
  const ps = new Set(same ? (prev.pins || []) : []);
  const teams = [], kept = [], t0 = performance.now();
  for (const part of parts){
    const pins = {};
    if (same) part.ids.forEach(id => { const ti = teamIndexOf(id, prev); if (ps.has(id) && ti >= part.off && ti < part.off + part.k){ pins[id] = ti - part.off; kept.push(id); } });
    const prevT = same ? prev.teams.slice(part.off, part.off + part.k) : null;
    optimize(part.ids, part.k, sport, pins, prevT).forEach(t => teams.push(t));
  }
  DB.teams[cls] = {k, teams, groups, pins:kept, at:Date.now()};
  sel = null; save(); render();
  const el = $('#results'); if (el && !document.body.classList.contains('present')) el.scrollIntoView({behavior:'smooth', block:'start'});
  console.log('teams made in', Math.round(performance.now() - t0), 'ms');
}
function moveStudent(id, t){
  const st = teamsState(); const from = teamIndexOf(id, st); if (from < 0 || from === t) return;
  st.teams[from] = st.teams[from].filter(x => x !== id); st.teams[t].push(id); st.teams[t].sort(byName);
  save(); render(); toast(`${nameOf(id)} → Team ${t+1}`);
}
function swapStudents(a, b){
  const st = teamsState(); const ta = teamIndexOf(a, st), tb = teamIndexOf(b, st);
  if (ta < 0 || tb < 0 || ta === tb) return;
  st.teams[ta] = st.teams[ta].map(x => x === a ? b : x).sort(byName);
  st.teams[tb] = st.teams[tb].map(x => x === b ? a : x).sort(byName);
  save(); render(); toast(`Swapped ${nameOf(a)} ⇄ ${nameOf(b)}`);
}
function togglePin(id){
  const st = teamsState(); const ps = new Set(st.pins || []);
  ps.has(id) ? ps.delete(id) : ps.add(id); st.pins = [...ps]; save(); render();
}
function removeFromTeams(id){
  const st = teamsState(); if (!st) return -1;
  const t = teamIndexOf(id, st); if (t < 0) return -1;
  st.teams[t] = st.teams[t].filter(x => x !== id); st.pins = (st.pins || []).filter(x => x !== id);
  return t;
}
/** Place a student into the best team (smallest teams only) or a given team. In level-split mode they join
    the group matching their level (Either: the group with the smaller teams). */
function placeStudent(id, team){
  const st = teamsState(); if (!st) return -1;
  if (teamIndexOf(id, st) >= 0) return teamIndexOf(id, st);
  let t = team;
  if (t == null || t < 0){
    let cand = st.teams.map((_, i) => i);
    if (st.groups){
      let g = levelPref(SM.get(id), DB.ui.sport);
      if (g === 'e'){
        const avg = x => { const ix = groupIdx(st, x); return ix.reduce((a, i) => a + st.teams[i].length, 0) / ix.length; };
        g = avg('c') <= avg('k') ? 'c' : 'k';
      }
      cand = groupIdx(st, g);
    }
    const ids = cand.flatMap(i => st.teams[i]).concat(id);
    const M = buildModel(ids, cand.length, DB.ui.sport);
    const a = new Int32Array(ids.length); cand.forEach((ti, li) => st.teams[ti].forEach(x => { a[M.ix.get(x)] = li; }));
    const minSize = Math.min(...cand.map(i => st.teams[i].length));
    let bestC = Infinity;
    cand.forEach((ti, li) => { if (st.teams[ti].length !== minSize) return; a[ids.length-1] = li; const c = M.cost(a); if (c < bestC){ bestC = c; t = ti; } });
  }
  st.teams[t].push(id); st.teams[t].sort(byName);
  return t;
}
function toggleAttendance(id){
  const abs = absentSet(); const nowAbsent = !abs.has(id);
  setAbsentFlag(id, nowAbsent);
  const st = teamsState();
  if (st){
    if (nowAbsent){ const t = removeFromTeams(id); if (t >= 0) toast(`${nameOf(id)} removed from Team ${t+1}`); }
    else { const t = placeStudent(id); if (t >= 0) toast(`${nameOf(id)} added to Team ${t+1}`); }
  }
  if (sel === id) sel = null;
  save(); render();
}
function deleteStudent(id){
  const s = SM.get(id); if (!s) return;
  for (const st of Object.values(DB.teams)){ st.teams = st.teams.map(t => t.filter(x => x !== id)); st.pins = (st.pins || []).filter(x => x !== id); }
  for (const c of Object.keys(DB.absent)) DB.absent[c] = DB.absent[c].filter(x => x !== id);
  DB.rules.together = DB.rules.together.filter(p => !p.includes(id));
  DB.rules.apart = DB.rules.apart.filter(p => !p.includes(id));
  delete DB.rules.strength[id];
  DB.students = DB.students.filter(x => x.id !== id);
  DB.students.forEach(x => { x.friends = x.friends.filter(f => f !== id); x.avoid = x.avoid.filter(f => f !== id); });
  reindex();
}

/* ------------------------------ Text out -------------------------------- */
function teamsText(){
  const st = teamsState(); if (!st) return '';
  const sport = DB.ui.sport, ev = evaluate(st, sport);
  const L = [`${DB.ui.cls} · ${sport === OVERALL ? 'Overall' : sport} · ${st.teams.length} teams`, ''];
  let lastG = null;
  st.teams.forEach((t, ti) => {
    if (st.groups && st.groups[ti] !== lastG){ lastG = st.groups[ti]; L.push(`== ${LV_NAME[lastG]} ==`, ''); }
    const inf = ev.info[ti], meta = [];
    if (DB.ui.showStrength) meta.push('strength ' + inf.sum);
    if (DB.ui.showGender) meta.push(`${inf.boys}B/${inf.girls}G`);
    L.push(`Team ${ti+1}` + (meta.length ? ` (${meta.join(', ')})` : ''));
    t.forEach(id => L.push('  ' + nameOf(id)));
    L.push('');
  });
  if (DB.ui.showSchedule) scheduleBlocks(st).forEach(b => {
    L.push(b.title);
    b.rr.forEach((r, i) => L.push(`Round ${i+1}: ` + r.games.map((g, c) => `Court ${c+1}: T${g[0]+b.off} v T${g[1]+b.off}`).join(' · ') + (r.rest.length ? ` · Rest: ${r.rest.map(x => 'T' + (x + b.off)).join(', ')}` : '')));
    L.push('');
  });
  return L.join('\n').trim() + '\n';
}
async function copyText(){
  const text = teamsText();
  try { await navigator.clipboard.writeText(text); toast('Copied teams to clipboard'); return; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  if (ok) toast('Copied teams to clipboard');
  else openDialog(`<div class="dlg"><h2>Copy these teams</h2><textarea readonly style="min-height:300px">${esc(text)}</textarea><div class="toolbar"><button class="btn primary" data-act="closedlg">Done</button></div></div>`);
}

document.addEventListener('click', async e => {

  switch (act){

    case 'kc': DB.ui.kC = +v; save(); render(); break;
    case 'kk': DB.ui.kK = +v; save(); render(); break;

    case 'lvreset': delete DB.levelMoves[lvKey()]; save(); render(); break;
    case 'make': generate(); break;
    case 'chip': {
      if (!sel){ sel = id; }
      else if (sel === id){ sel = null; }
      else {
        const st = teamsState();
        if (teamIndexOf(sel, st) === teamIndexOf(id, st)) sel = id;
        else { const a = sel; sel = null; swapStudents(a, id); return; }
      }
      render(); break; }
    case 'movehere': { const a = sel; sel = null; moveStudent(a, +el.dataset.team); break; }
    case 'pin': togglePin(id); break;
    case 'absentsel': { sel = null; toggleAttendance(id); break; }
    case 'desel': sel = null; render(); break;
    case 'lockteam': {
      const st = teamsState(), t = st.teams[+el.dataset.team], ps = new Set(st.pins || []);
      const all = t.every(x => ps.has(x)); t.forEach(x => all ? ps.delete(x) : ps.add(x));
      st.pins = [...ps]; save(); render(); toast(all ? `Team ${+el.dataset.team+1} unlocked` : `Team ${+el.dataset.team+1} locked`); break; }
    case 'unlockall': { const st = teamsState(); st.pins = []; save(); render(); toast('Everyone unlocked'); break; }
    case 'toggle': DB.ui[v] = !DB.ui[v]; save(); render(); break;
    case 'copy': copyText(); break;
    case 'print': { sel = null; render(); const old = document.title; document.title = `Teams ${DB.ui.cls} ${DB.ui.sport}`; window.print(); document.title = old; break; }
    case 'present': document.body.classList.toggle('present'); sel = null; render(); window.scrollTo(0, 0); break;
    case 'addlate': openAddLate(); break;
    case 'lateg': el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'lateadd': case 'latenew': {
      const team = +$('#lateTeam').value;
      let sid = id;
      if (act === 'latenew'){
        const nm = $('#lateName').value.trim(); if (!nm){ toast('Type a name first'); return; }

      }

    case 'closedlg': closeDialog(); break;
    case 'gender': { const s = SM.get(id); s.genderT = (v === (s.gender || '')) ? null : v; save(); render(); break; }
    case 'str': {
      const s = SM.get(id), sport = DB.ui.sport;
      const nv = Math.max(1, Math.min(5, strengthOf(s, sport) + (+el.dataset.d)));

    case 'strreset': { const o = DB.rules.strength[id]; if (o){ delete o[DB.ui.sport]; if (!Object.keys(o).length) delete DB.rules.strength[id]; } save(); render(); break; }

    case 'addstudent': { const nm = $('#newName').value.trim(); if (!nm) return; newStudent(nm, DB.ui.cls); save(); render(); toast(`Added ${nm}`); break; }
    case 'addpair': {
      const kind = el.dataset.kind, a = $(kind === 'together' ? '#tgA' : '#apA').value, b = $(kind === 'together' ? '#tgB' : '#apB').value;
      if (!a || !b || a === b){ toast('Pick two different students'); return; }

      const same = p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a);
      if (list.some(same)){ toast('Already added'); return; }
      DB.rules[kind === 'together' ? 'apart' : 'together'] = other.filter(p => !same(p));

    case 'delpair': DB.rules[el.dataset.kind].splice(+el.dataset.i, 1); save(); render(); break;
    case 'roster': { const txt = $('#rosterText').value; if (!txt.trim()) return; const r = saveRoster(DB.ui.cls, txt); save(); render();

    case 'backup': {
      const blob = new Blob([JSON.stringify(DB, null, 1)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `gym-teams-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); break; }

  }
});

/* Mouse drag between teams (touch uses tap-to-select so the page still scrolls). */
function dropTarget(x, y){
  const el = document.elementFromPoint(x, y); if (!el || !drag) return null;
  const st = teamsState(), from = teamIndexOf(drag.id, st);
  const li = el.closest('li.p');
  if (li && li.dataset.id !== drag.id && teamIndexOf(li.dataset.id, st) !== from) return {kind:'swap', id:li.dataset.id, el:li};
  const tm = el.closest('.team');
  if (tm && +tm.dataset.team !== from) return {kind:'move', team:+tm.dataset.team, el:tm};
  return null;
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  const li = e.target.closest('li.p'); if (!li) return;
  drag = {id:li.dataset.id, x:e.clientX, y:e.clientY, started:false, src:li, ghost:null};
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started){
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.started = true; drag.ghost = drag.src.cloneNode(true); drag.ghost.className = 'p ghost';
    document.body.appendChild(drag.ghost); drag.src.classList.add('dragging');
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
  const t = dropTarget(e.clientX, e.clientY); if (t) t.el.classList.add('drop-target');
});
document.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag;
  if (!d.started){ drag = null; return; }
  const t = dropTarget(e.clientX, e.clientY);
  drag = null; d.ghost.remove(); d.src.classList.remove('dragging');
  document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  sel = null;
  if (t){ t.kind === 'swap' ? swapStudents(d.id, t.id) : moveStudent(d.id, t.team); } else render();
});

  const sports = ['Basketball','Volleyball','Soccer','Floor Hockey','Badminton','Dodgeball','Ultimate Frisbee','Team Handball','Softball','Track & Field','Flag Football','Kickball'];
  const head = ['Timestamp','Class','Your name (8A)','Your name (8B)','Gender (optional)',
    ...sports.map(s => `How good are you at each? [${s}]`),
    'Pick up to 6 friends you’d like on your team (8A)','Pick up to 6 friends you’d like on your team (8B)',
    'Anyone you’d rather NOT be on a team with? (8A)','Anyone you’d rather NOT be on a team with? (8B)','Anything else your teacher should know? (optional)',
    ...sports.map(s => `If there is an option, would you prefer to play a casual, more friendly game, or a more competitive game with more competitive rules? [${s}]`)];
  const q = v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const lines = [head.map(q).join(',')];
  const label = r => r === 0 ? 'Rather not play' : r === 1 ? '1 - New to it' : r === 5 ? '5 - Very strong' : String(r);
  let minute = 0;
  const makeRow = (cls, roster, [name, g], opts = {}) => {
    const ath = 1.4 + R() * 3.2;
    const ratings = sports.map(() => R() < 0.07 ? 0 : Math.max(1, Math.min(5, Math.round(ath + (R() - 0.5) * 2))));
    const others = roster.filter(x => x[0] !== name);
    const same = others.filter(x => x[1] === g && g), diff = others.filter(x => !(x[1] === g && g));
    const nf = 1 + Math.floor(R() * 6);
    let friends = pick(same, Math.min(same.length, Math.ceil(nf * 0.7))).concat(pick(diff, Math.floor(nf * 0.3))).slice(0, 6).map(x => x[0]);
    if (opts.friends) friends = opts.friends;
    const lv = sports.map((_, i) => { const x = ratings[i] === 0 ? 1 : ratings[i], r = R(); return x >= 4 ? (r < .6 ? 'Competitive' : r < .85 ? 'Either' : 'Casual') : x <= 2 ? (r < .6 ? 'Casual' : r < .85 ? 'Either' : 'Competitive') : (r < .35 ? 'Competitive' : r < .7 ? 'Casual' : 'Either'); });
    const gtxt = g === 'b' ? 'Boy' : g === 'g' ? 'Girl' : 'Prefer not to say';
    minute += 1 + Math.floor(R() * 9);
    const ts = `11/${opts.day || 18}/2026 ${8 + Math.floor(minute / 60)}:${String(minute % 60).padStart(2, '0')}:${String(Math.floor(R() * 60)).padStart(2, '0')}`;
    const isA = cls === '8A';
    const row = [ts, opts.cls || cls, isA ? (opts.as || name) : '', isA ? '' : (opts.as || name), gtxt, ...ratings.map(label),
      isA ? friends.join(', ') : '', isA ? '' : friends.join(', '), isA ? (opts.avoid || '') : '', isA ? '' : (opts.avoid || ''), opts.note || '', ...lv];
    lines.push(row.map(q).join(','));
  };
  // 8A: Daisy Mbeki and Wyatt Brooks didn't fill in the form (they come from the class list).
  A.forEach(st => {
    const n = st[0];
    if (n === 'Daisy Mbeki' || n === 'Wyatt Brooks') return;
    if (n === 'Ella Novak') makeRow('8A', A, st, {day:17, note:'first try, ignore'});  // duplicate: earlier submission
    const o = {};
    if (n === 'Jordan Patel'){ o.as = 'Jordon Patel'; }                            // misspelled own name
    if (n === 'Mateo Rossi'){ o.as = 'Rossi, Mateo'; o.friends = ['Kai Nakamura', 'Chloe Martín', 'grace huang']; } // last-first + messy friend names
    if (n === 'Hassan Ali'){ o.avoid = 'Owen Clarke'; }
    if (n === 'Priya Singh'){ o.avoid = 'Vera Kowalski'; o.note = 'Sprained ankle last month, ok now'; }
    if (n === 'Sam Whitford'){ o.cls = '8 a'; }                                     // messy class text
    makeRow('8A', A, st, o);
  });
  B.forEach(st => {
    if (st[0] === 'Marcus Bell') return;
    const o = {};
    if (st[0] === 'Theo Laurent') o.avoid = 'Jack Thompson';
    if (st[0] === 'Lucy Tan') o.cls = '8b ';
    makeRow('8B', B, st, o);
  });
  DB = freshDB(); reindex();
  saveRoster('8A', A.map(x => x[0]).join('\n'));
  saveRoster('8B', B.map(x => x[0]).join('\n'));
  // Non-responders: set gender as a teacher would
  [['Daisy Mbeki','g'],['Wyatt Brooks','b'],['Marcus Bell','b']].forEach(([n, g]) => { const s = DB.students.find(x => x.name === n); if (s) s.genderT = g; });
  importCSV(lines.join('\n'), '8A');
  DB.ui.sport = 'Basketball'; DB.ui.cls = '8A'; DB.ui.k = 4; DB.ui.tab = 'teams';
  sel = null; save(); render(); toast('Sample data loaded: 30 in 8A, 28 in 8B');
  window.__sampleCSV = lines.join('\n');
}

load(); render();
</script>
</body>
